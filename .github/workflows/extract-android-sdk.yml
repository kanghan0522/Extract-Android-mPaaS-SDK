name: Extract Android mPaaS SDK

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Standard Android Project Structure
        run: |
          mkdir mPaaS_Project
          cd mPaaS_Project
          
          # 1. settings.gradle 생성
          echo "rootProject.name = 'mPaaS_Extract'" > settings.gradle
          echo "include ':app'" >> settings.gradle
          
          # 2. Project 레벨 build.gradle 생성 (가이드와 동일)
          cat <<EOF > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
                  maven {
                      url "https://mvn.cloud.alipay.com/nexus/content/repositories/releases/"
                      credentials { username "mvn_read_ws"; password "mrk8929" }
                  }
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:7.4.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven {
                      url "https://mvn.cloud.alipay.com/nexus/content/repositories/releases/"
                      credentials { username "mvn_read_ws"; password "mrk8929" }
                  }
              }
          }
          EOF
          
          # 3. App 모듈 구조 생성
          mkdir -p app/src/main
          echo '<manifest package="com.example.mpaas"><application/></manifest>' > app/src/main/AndroidManifest.xml
          
          # 4. Module 레벨 build.gradle 생성 (가이드와 동일)
          cat <<EOF > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.example.mpaas'
              compileSdk 33
          }
          dependencies {
              implementation platform("com.mpaas.android:mpaas-baseline:10.2.3-1850000")
              implementation "com.mpaas.android:datacenter"
          }
          EOF
          
          # 5. Gradle 호환성 해결을 위해 적절한 버전을 로드
          gradle wrapper --gradle-version 7.5.1

      - name: Download Dependencies via Android Gradle Plugin
        run: |
          cd mPaaS_Project
          # 빌드를 실행하지 않고 의존성 캐시만 전부 다운로드 받도록 트리거
          ./gradlew app:dependencies --info

      - name: Collect and Zip Artifacts
        run: |
          mkdir mPaaS_Android_SDK
          # 로컬 캐시에 다운로드된 모든 AAR 복사
          find ~/.gradle/caches/modules-2/files-2.1/ -name "*.aar" -exec cp {} mPaaS_Android_SDK/ \;
          
          zip -r mPaaS_Android_SDK.zip mPaaS_Android_SDK/

      - name: Upload Artifact for Download
        uses: actions/upload-artifact@v4
        with:
          name: mPaaS_Official_Android_Artifacts
          path: mPaaS_Android_SDK.zip
          retention-days: 1
