name: Final AAR Existence Radar

on: 
  workflow_dispatch:

jobs:
  ping_true_aars:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install requests
        run: pip install requests

      - name: Ping Latest Hotfix AARs
        shell: python
        run: |
          import requests

          base_url = "https://mvn.cloud.alipay.com/nexus/content/repositories/releases/com/mpaas/android"
          latest_ver = "cp_change_38379.1860000"

          # 방금 스캔으로 살아있음이 확인된 타겟들
          targets = ["storage", "secstorage", "gmssl"]

          print(f"[*] Targeting Exact AAR Files for version {latest_ver}...\n")

          for t in targets:
              aar_url = f"{base_url}/{t}/{latest_ver}/{t}-{latest_ver}.aar"
              print(f"Checking URL: {aar_url}")
              
              try:
                  # stream=True로 설정하여 헤더(용량/상태)만 먼저 봅니다.
                  r = requests.get(aar_url, stream=True, timeout=10)
                  status = r.status_code
                  
                  if status == 200:
                      size_bytes = r.headers.get('content-length')
                      if size_bytes and size_bytes.isdigit():
                          size_kb = int(size_bytes) / 1024
                          if size_kb < 5:
                              print(f"  [⚠️ 200 OK] File exists, but it's only {size_kb:.1f} KB. (Likely a fake 401 block file)\n")
                          else:
                              print(f"  [✅ 200 OK] TRUE FILE EXISTS! Size: {size_kb / 1024:.2f} MB\n")
                      else:
                          print("  [✅ 200 OK] File exists! (Size unknown)\n")
                  elif status == 404:
                      print("  [❌ 404] Not Found. (Path is wrong or removed)\n")
                  elif status in [401, 403]:
                      print(f"  [🔒 {status}] Server confirms file exists, but access is BLOCKED.\n")
                  else:
                      print(f"  [❓ {status}] Unknown response.\n")
              except Exception as e:
                  print(f"  [Error] {e}\n")
