name: Extract Android mPaaS SDK

on: 
  workflow_dispatch:

jobs:
  build:
    # 리눅스 환경에서 실행 (Gradle 9.4.1 기본 탑재)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Lightweight Downloader
        run: |
          # 안드로이드 플러그인 의존성 없이, 순수하게 Maven에서 파일만 채가는 스크립트
          cat <<EOF > build.gradle
          plugins {
              id 'java'
          }

          repositories {
              google()
              mavenCentral()
              maven {
                  url "https://mvn.cloud.alipay.com/nexus/content/repositories/releases/"
                  credentials {
                      username "mvn_read_ws"
                      password "mrk8929"
                  }
              }
          }

          configurations {
              mPaaSDownload
          }

          dependencies {
              // mPaaS 데이터센터 모듈을 직접 지정 (버전은 서버가 자백한 최신값 사용)
              mPaaSDownload "com.mpaas.android:datacenter:10.2.3-1850000"
          }

          tasks.register('extractSDK', Copy) {
              from configurations.mPaaSDownload
              into "mPaaS_Artifacts"
          }
          EOF

      - name: Run Downloader
        run: |
          # Gradle 9.x에서 안전하게 실행
          gradle extractSDK --info

      - name: Zip and Upload
        run: |
          # 추출된 AAR 파일들을 압축
          zip -r mPaaS_Android_SDK.zip mPaaS_Artifacts/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mPaaS_Official_Android_AAR
          path: mPaaS_Android_SDK.zip
          retention-days: 1
