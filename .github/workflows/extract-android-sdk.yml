name: Hunt for libdatabase_sqlcrypto.so

on: 
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  hunt-crypto:
    runs-on: ubuntu-latest
    
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install requests

      - name: Run Crypto Deep Hunter Script
        run: |
          python -c "
          import requests
          import os
          import xml.etree.ElementTree as ET
          import zipfile
          import shutil

          # 저장할 폴더 생성
          os.makedirs('mpaas_vault', exist_ok=True)
          os.makedirs('extracted_so', exist_ok=True)
          
          base_url = 'https://mvn.cloud.alipay.com/nexus/content/repositories/releases'
          target_file = 'libdatabase_sqlcrypto.so'
          
          # mPaaS에서 사용될 가능성이 높은 Group ID 리스트 (사전 대입)
          group_ids = [
              'com.alipay.android.phone.mobilesdk',
              'com.alipay.mobile.base',
              'com.mpaas.android',
              'com.mpaas.android.sqlite',
              'com.alipay.android',
              'com.alipay.mobile'
          ]
          
          # DB/암호화 관련 아티팩트 명칭 리스트
          artifact_ids = ['sqlite', 'wcdb', 'datacenter', 'sqlcrypto', 'database']
          
          headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}
          found_target = False

          print(f'[*] Starting Deep Hunt for {target_file}...\n')

          for gid in group_ids:
              if found_target: break
              group_path = gid.replace('.', '/')
              
              for aid in artifact_ids:
                  if found_target: break
                  
                  # 1. 메타데이터(버전 목록) 확인
                  meta_url = f'{base_url}/{group_path}/{aid}/maven-metadata.xml'
                  try:
                      res = requests.get(meta_url, headers=headers, timeout=5)
                      if res.status_code == 200:
                          print(f'[+] Valid Module Found: {gid}:{aid}')
                          root = ET.fromstring(res.text)
                          versions = [v.text for v in root.findall('.//version')]
                          
                          if not versions: continue
                          
                          # 2. 가장 최신 버전 선택
                          latest_version = versions[-1]
                          print(f'  -> Fetching latest version: {latest_version}')
                          
                          aar_name = f'{aid}-{latest_version}.aar'
                          dl_url = f'{base_url}/{group_path}/{aid}/{latest_version}/{aar_name}'
                          
                          # 3. 최신 SDK 다운로드
                          dl_res = requests.get(dl_url, headers=headers)
                          if dl_res.status_code == 200:
                              temp_aar = f'temp_{aar_name}'
                              with open(temp_aar, 'wb') as f:
                                  f.write(dl_res.content)
                                  
                              # 4. 압축 해제 후 내부에서 .so 파일 스캔
                              with zipfile.ZipFile(temp_aar, 'r') as zip_ref:
                                  file_list = zip_ref.namelist()
                                  so_paths = [f for f in file_list if target_file in f]
                                  
                                  if so_paths:
                                      print(f'\n[★★★ BINGO ★★★] Found target inside {aar_name}!')
                                      
                                      # 발견된 원본 SDK 복사
                                      shutil.copy(temp_aar, f'mpaas_vault/{aar_name}')
                                      
                                      # 발견된 .so 파일만 따로 추출하여 저장 (여러 아키텍처 지원)
                                      for path in so_paths:
                                          zip_ref.extract(path, 'extracted_so')
                                          print(f'  -> Extracted: {path}')
                                          
                                      found_target = True
                              
                              # 임시 파일 삭제
                              os.remove(temp_aar)
                  except Exception as e:
                      pass

          if not found_target:
              print(f'\n[X] Scan complete. Could not find {target_file} in standard public mPaaS paths.')
              print(f'[*] Recommendation: The module might be fully private or uses a different Group ID.')
          "

      - name: Upload Target SDK & .so Files
        uses: actions/upload-artifact@v4
        with:
          name: Extracted-Crypto-Artifacts
          path: |
            mpaas_vault/
            extracted_so/
