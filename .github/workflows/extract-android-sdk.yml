name: Android SDK Recon & Extract

on: 
  workflow_dispatch:

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install requests
        run: pip install requests

      - name: Reconnaissance & Metadata Carving
        shell: python
        run: |
          import requests
          from requests.auth import HTTPBasicAuth
          import os

          auth = HTTPBasicAuth("mvn_read_ws", "mrk8929")
          base_url = "https://mvn.cloud.alipay.com/nexus/content/repositories/releases"
          
          # [수사 대상 1] 가장 상위 지도(Metadata) 파일들
          metadata_urls = [
              f"{base_url}/com/mpaas/android/mpaas-baseline/maven-metadata.xml",
              f"{base_url}/com/mpaas/android/datacenter/maven-metadata.xml",
              f"{base_url}/com/mpaas/android/sqlite/maven-metadata.xml"
          ]

          # [수사 대상 2] 전체 설계도(BOM) 파일
          # 이 파일 안에 모든 하위 모듈의 진짜 이름과 버전이 적혀 있습니다.
          bom_url = f"{base_url}/com/mpaas/android/mpaas-baseline/10.2.3-1850000/mpaas-baseline-10.2.3-1850000.pom"

          print("[*] Starting Reconnaissance phase...")
          
          os.makedirs("recon_results", exist_ok=True)

          # 1. 지도 파일들 확보 시도
          for url in metadata_urls:
              name = url.split('/')[-2] + "_metadata.xml"
              print(f"[?] Looking for map: {url}")
              r = requests.get(url, auth=auth)
              if r.status_code == 200:
                  print(f"    [+] Found Metadata for {name}!")
                  with open(f"recon_results/{name}", "w") as f: f.write(r.text)
              else:
                  print(f"    [-] Not found (Status: {r.status_code})")

          # 2. 설계도(BOM) 확보 시도 (가장 중요)
          print(f"[?] Attempting to steal BOM: {bom_url}")
          r_bom = requests.get(bom_url, auth=auth)
          if r_bom.status_code == 200:
              print("    [!] BOM STOLEN SUCCESSFULLY!")
              with open("recon_results/master_plan.pom", "w") as f: f.write(r_bom.text)
              
              # 설계도 내용 중 datacenter와 sqlite 관련 줄만 출력해서 육안 확인
              print("\n--- BOM CLUES (Search results) ---")
              for line in r_bom.text.split('\n'):
                  if "datacenter" in line or "sqlite" in line:
                      print(line.strip())
          else:
              print(f"    [X] Failed to get BOM (Status: {r_bom.status_code})")

      - name: Upload Recon Data
        uses: actions/upload-artifact@v4
        with:
          name: mPaaS_Recon_Data
          path: recon_results/
