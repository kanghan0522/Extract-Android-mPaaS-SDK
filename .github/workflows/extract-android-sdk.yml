name: Extract Android mPaaS SDK

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Gradle Downloader (v9.x Compatible)
        run: |
          # 1. settings.gradle 생성 (Gradle 9부터는 여기서 저장소 설정을 권장합니다)
          cat <<EOF > settings.gradle
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven {
                      url = uri("https://mvn.cloud.alipay.com/nexus/content/repositories/releases/")
                      credentials {
                          username = "mvn_read_ws"
                          password = "mrk8929"
                      }
                  }
              }
          }
          rootProject.name = 'mPaaS-Extractor'
          EOF

          # 2. build.gradle 생성 (최신 문법 적용)
          cat <<EOF > build.gradle
          plugins {
              id 'java-library'
          }

          // 다운로드 전용 설정 그룹 생성
          def downloadConfig = configurations.create("mPaaSDownload")

          dependencies {
              // 이전 로그에서 확인된 가장 유망한 버전을 타격합니다.
              mPaaSDownload "com.mpaas.android:datacenter:10.2.3-1850000"
          }

          // 파일을 복사하는 태스크
          tasks.register('extractSDK', Copy) {
              from downloadConfig
              into "mPaaS_Artifacts"
          }
          EOF

      - name: Execute Download
        run: |
          # --no-daemon 옵션으로 깔끔하게 실행
          gradle extractSDK --no-daemon --info

      - name: Zip and Upload
        run: |
          # 추출된 파일이 있는지 확인하고 압축
          ls -R mPaaS_Artifacts/
          zip -r mPaaS_Android_SDK.zip mPaaS_Artifacts/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mPaaS_Official_Android_AAR
          path: mPaaS_Android_SDK.zip
          retention-days: 1
