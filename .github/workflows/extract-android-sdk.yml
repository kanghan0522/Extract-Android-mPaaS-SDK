name: Pure File Existence Radar

on: 
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install requests
        run: pip install requests

      - name: Send Radar Pings
        shell: python
        run: |
          import requests

          # [확인 대상] 우리가 찾고자 하는 알맹이(AAR) 파일들의 정확한 예상 주소들
          urls_to_check = [
              # 1. mPaaS 표준 경로
              "https://mvn.cloud.alipay.com/nexus/content/repositories/releases/com/mpaas/android/datacenter/10.2.3-1850000/datacenter-10.2.3-1850000.aar",
              "https://mvn.cloud.alipay.com/nexus/content/repositories/releases/com/mpaas/android/sqlite/10.2.3-1850000/sqlite-10.2.3-1850000.aar",
              
              # 2. Alipay 내부 빌드 경로
              "https://mvn.cloud.alipay.com/nexus/content/repositories/releases/com/alipay/android/phone/mobilesdk/datacenter-build/10.2.3-1850000/datacenter-build-10.2.3-1850000.aar",
              "https://mvn.cloud.alipay.com/nexus/content/repositories/releases/com/alipay/android/phone/mobilesdk/sqlite-build/10.2.3-1850000/sqlite-build-10.2.3-1850000.aar",
              
              # 3. [대조군] 이전에 성공했던 POM(지도) 파일 - 이것은 무조건 200이 떠야 합니다.
              "https://mvn.cloud.alipay.com/nexus/content/repositories/releases/com/mpaas/android/mpaas-baseline/10.2.3-1850000/mpaas-baseline-10.2.3-1850000.pom"
          ]

          print("[*] Sending Radar Pings to Alipay Server...\n")

          for url in urls_to_check:
              print(f"Checking URL: {url}")
              try:
                  # stream=True로 설정하여 내용물은 받지 않고 헤더만 빠르게 확인합니다.
                  r = requests.get(url, stream=True, timeout=10)
                  status = r.status_code
                  
                  if status == 200:
                      # 200이면 파일이 무조건 존재함. 용량도 확인.
                      size_bytes = r.headers.get('content-length', 'Unknown')
                      size_mb = round(int(size_bytes) / (1024 * 1024), 2) if size_bytes.isdigit() else 'Unknown'
                      print(f"  [✅ 200 OK] FILE EXISTS! (Size: {size_mb} MB)\n")
                  elif status == 404:
                      print(f"  [❌ 404 Not Found] FILE DOES NOT EXIST at this path.\n")
                  elif status == 401 or status == 403:
                      print(f"  [🔒 {status} Locked] File might exist, but access is blocked.\n")
                  else:
                      print(f"  [❓ {status} Unknown] Server responded with an unusual code.\n")
              except Exception as e:
                  print(f"  [⚠️ Error] Connection failed: {e}\n")
