name: Scan Latest mPaaS Versions

on: 
  workflow_dispatch:

jobs:
  scan_versions:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install requests
        run: pip install requests

      - name: Check Maven Metadata
        shell: python
        run: |
          import requests
          import xml.etree.ElementTree as ET

          base_url = "https://mvn.cloud.alipay.com/nexus/content/repositories/releases/com/mpaas/android"
          
          # [타겟] 우리가 의심하고 있는 핵심 모듈들
          modules = [
              "datacenter",
              "sqlite",
              "storage",
              "secstorage",
              "security",
              "gmssl",
              "mpaas-baseline"
          ]

          print("[*] Scanning Alipay Server for Latest Versions...\n")

          for mod in modules:
              metadata_url = f"{base_url}/{mod}/maven-metadata.xml"
              try:
                  r = requests.get(metadata_url, timeout=10)
                  if r.status_code == 200:
                      root = ET.fromstring(r.text)
                      
                      # <latest> 태그나 <release> 태그를 찾음
                      latest = root.find('.//versioning/latest')
                      release = root.find('.//versioning/release')
                      
                      # 명시적인 최신 버전 태그가 없다면 <versions> 목록의 맨 마지막 것을 가져옴
                      if latest is not None and latest.text:
                          latest_ver = latest.text
                      elif release is not None and release.text:
                          latest_ver = release.text
                      else:
                          versions = root.findall('.//versions/version')
                          latest_ver = versions[-1].text if versions else "Unknown"

                      print(f"  [+] {mod.ljust(15)} : 최신 버전 ➔ {latest_ver}")
                  else:
                      print(f"  [-] {mod.ljust(15)} : 서버에 모듈이 존재하지 않음 (404)")
              except Exception as e:
                  print(f"  [!] Error checking {mod}: {e}")
