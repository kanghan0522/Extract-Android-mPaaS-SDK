name: Steal Master BOM (Raw Data)

on: 
  workflow_dispatch:

jobs:
  steal_bom:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install requests
        run: pip install requests

      - name: Download Raw BOM
        shell: python
        run: |
          import requests
          import os

          bom_url = "https://mvn.cloud.alipay.com/nexus/content/repositories/releases/com/mpaas/android/mpaas-baseline/10.2.3-1850000/mpaas-baseline-10.2.3-1850000.pom"
          os.makedirs("mPaaS_Intel", exist_ok=True)
          
          print(f"[*] Downloading Master BOM from: {bom_url}")
          # 인증 없이 접근 가능했던 URL
          r = requests.get(bom_url, timeout=15)
          
          if r.status_code == 200:
              print("[+] Success! Master BOM Secured.")
              # 분석이 쉽도록 확장자를 .xml로 변경하여 저장
              with open("mPaaS_Intel/mpaas-baseline-10.2.3.xml", "w", encoding="utf-8") as f:
                  f.write(r.text)
          else:
              print(f"[X] Failed with status {r.status_code}")
              exit(1)

      - name: Upload BOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mPaaS_Master_BOM_Raw
          path: mPaaS_Intel/
          retention-days: 1
