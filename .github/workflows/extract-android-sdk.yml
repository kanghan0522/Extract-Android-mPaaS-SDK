name: Extract Android mPaaS SDK

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Gradle Downloader (Direct Artifact)
        run: |
          cat <<EOF > settings.gradle
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven {
                      url = uri("https://mvn.cloud.alipay.com/nexus/content/repositories/releases/")
                      allowInsecureProtocol = true
                      credentials {
                          username = "mvn_read_ws"
                          password = "mrk8929"
                      }
                  }
              }
          }
          rootProject.name = 'mPaaS-Extractor'
          EOF

          cat <<EOF > build.gradle
          plugins {
              id 'java-library'
          }

          def downloadConfig = configurations.create("mPaaSDownload")

          dependencies {
              // [논리적 해결] @aar를 붙여 POM 파일이 없어도 무시하고 바이너리만 가져오도록 강제합니다.
              // 가장 표준적인 10.2.3 버전을 타겟팅합니다.
              mPaaSDownload "com.mpaas.android:datacenter:10.2.3@aar"
          }

          tasks.register('extractSDK', Copy) {
              from downloadConfig
              into "mPaaS_Artifacts"
              // 저장 시 확장자가 명확하도록 이름을 정리합니다.
              rename { it.endsWith('.aar') ? it : "${it}.aar" }
          }
          EOF

      - name: Execute Download (Bypass POM)
        run: |
          # --no-daemon으로 깨끗한 환경에서 실행하며, 실패 시에도 로그를 상세히 출력합니다.
          gradle extractSDK --no-daemon --stacktrace

      - name: Zip and Upload
        run: |
          ls -R mPaaS_Artifacts/ || echo "No files found"
          zip -r mPaaS_Android_SDK.zip mPaaS_Artifacts/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mPaaS_Official_Android_AAR
          path: mPaaS_Android_SDK.zip
          retention-days: 1
