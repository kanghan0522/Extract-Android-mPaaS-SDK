- name: Run Direct Download Script
        run: |
          python -c "
          import requests
          import os

          os.makedirs('mpaas_vault', exist_ok=True)
          base_repo_url = 'https://mvn.cloud.alipay.com/nexus/content/repositories/releases'

          # 분석 대상 앱에서 추출한 정보로 아래 목록을 채워주세요.
          # 형식: (Group ID, Artifact ID, Version)
          target_libraries = [
              ('com.alipay.android.phone.mobilesdk', 'datacenter', '1.0.0.0'), # 예시 버전입니다. 실제 버전을 기입해야 합니다.
              ('com.alipay.android.phone.mobilesdk', 'sqlite', '1.0.0.0'),
              ('com.alipay.mobile.security', 'security', '1.0.0.0'),
              ('com.alipay.mobile.common', 'common', '1.0.0.0')
          ]

          headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'}

          for group_id, artifact_id, version in target_libraries:
              print(f'\n[*] Target: {artifact_id} ({version})')
              
              # Maven 경로 규칙에 따른 URL 생성
              group_path = group_id.replace('.', '/')
              file_name = f'{artifact_id}-{version}.aar'
              direct_url = f'{base_repo_url}/{group_path}/{artifact_id}/{version}/{file_name}'
              
              print(f'[*] Requesting: {direct_url}')
              response = requests.get(direct_url, headers=headers)
              
              if response.status_code == 200:
                  with open(f'mpaas_vault/{file_name}', 'wb') as f:
                      f.write(response.content)
                  print(f'[+] Success: Saved {file_name}')
              elif response.status_code == 404:
                  print(f'[X] Error 404: File not found at this exact path. (Check Group ID or Version)')
              else:
                  print(f'[X] Error {response.status_code}')
          "
