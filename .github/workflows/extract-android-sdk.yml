name: Android SDK Final Probe

on: 
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install requests
        run: pip install requests
      - name: Anonymous Access Test
        shell: python
        run: |
          import requests
          url = "https://mvn.cloud.alipay.com/nexus/content/repositories/releases/com/mpaas/android/mpaas-baseline/10.2.3-1850000/mpaas-baseline-10.2.3-1850000.pom"
          
          print(f"[*] Testing Anonymous Access on: {url}")
          # auth 매개변수를 완전히 제거하고 요청합니다.
          r = requests.get(url, timeout=15)
          
          print(f"[!] Result: Status {r.status_code}")
          if r.status_code == 200:
              print("[+++] AMAZING! Anonymous access is allowed. Stealing now...")
          else:
              print("[X] Access Denied. The vault is truly locked.")
              exit(1)
