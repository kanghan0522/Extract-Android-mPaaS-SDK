name: Extract Android mPaaS SDK

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Gradle Force-Downloader
        run: |
          cat <<EOF > build.gradle
          apply plugin: 'java'

          repositories {
              google()
              mavenCentral()
              maven {
                  url "https://mvn.cloud.alipay.com/nexus/content/repositories/releases/"
                  credentials {
                      username "mvn_read_ws"
                      password "mrk8929"
                  }
              }
          }

          configurations {
              mPaaS_Artifacts {
                  canBeResolved = true
                  transitive = true // 연관된 모든 라이브러리(SQLCipher 등)도 함께 가져옴
              }
          }

          dependencies {
              // baseline을 통해 연관된 모든 아티팩트를 묶음으로 호출
              mPaaS_Artifacts platform("com.mpaas.android:mpaas-baseline:10.2.3-1850000")
              // 분석 타겟인 datacenter 명시
              mPaaS_Artifacts "com.mpaas.android:datacenter"
          }

          // [핵심] 실제로 파일을 로컬로 복사하는 태스크 정의
          tasks.register('extractMySDK', Copy) {
              from configurations.mPaaS_Artifacts
              into "extracted_files"
          }
          EOF

      - name: Execute Force Download
        run: |
          gradle wrapper --gradle-version 7.6
          # help 대신 우리가 만든 'extractMySDK' 태스크를 직접 실행합니다.
          ./gradlew extractMySDK --info --stacktrace

      - name: Verify and Zip
        run: |
          echo "### Contents of extracted_files ###"
          ls -R extracted_files/ || echo "Folder is still empty"
          
          # 파일이 존재할 때만 압축
          if [ "$(ls -A extracted_files/)" ]; then
            zip -r mPaaS_Android_SDK.zip extracted_files/
          else
            echo "Error: Download failed again. Check the credentials or version."
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mPaaS_Final_Android_Files
          path: mPaaS_Android_SDK.zip
          retention-days: 1
