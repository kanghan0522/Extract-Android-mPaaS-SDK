- name: Run Nexus API Extractor Script (Debug Mode)
        run: |
          python -c "
          import requests
          import os
          import json

          # mPaaS 핵심 모듈 명칭
          targets = ['datacenter', 'sqlite', 'security', 'common']
          os.makedirs('mpaas_vault', exist_ok=True)

          for target in targets:
              print(f'\n=============================================')
              print(f'[*] Target Analysis: {target}')
              
              # 단순 키워드(q) 대신 정확한 artifactId로 검색 (mPaaS 구조 반영)
              api_url = f'https://mvn.cloud.alipay.com/nexus/service/rest/v1/search/assets?repository=releases&maven.artifactId={target}&maven.extension=aar'
              
              headers = {
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                  'Accept': 'application/json'
              }
              
              print(f'[*] GET {api_url}')
              response = requests.get(api_url, headers=headers)
              
              if response.status_code == 200:
                  data = response.json()
                  items = data.get('items', [])
                  
                  if items:
                      # 가장 최근 버전의 다운로드 링크 추출
                      download_url = items[0]['downloadUrl']
                      file_name = download_url.split('/')[-1]
                      print(f'[+] Artifact found: {download_url}')
                      
                      try:
                          file_data = requests.get(download_url, headers=headers, timeout=30).content
                          with open(f'mpaas_vault/{file_name}', 'wb') as f:
                              f.write(file_data)
                          print(f'[+] Successfully Extracted: {file_name}')
                      except Exception as e:
                          print(f'[X] Download failed: {e}')
                  else:
                      print(f'[-] API OK (200), but NO items matched. Server response:')
                      print(json.dumps(data, indent=2))
              else:
                  print(f'[X] API Blocked or Error. Status Code: {response.status_code}')
                  print(f'Response Body: {response.text[:200]}')
              print(f'=============================================\n')
          "
