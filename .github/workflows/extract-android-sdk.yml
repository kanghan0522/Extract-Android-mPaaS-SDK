name: Extract Android mPaaS SDK

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Advanced Downloader
        run: |
          cat <<EOF > build.gradle
          apply plugin: 'java'

          repositories {
              google()
              mavenCentral()
              maven {
                  url "https://mvn.cloud.alipay.com/nexus/content/repositories/releases/"
                  // [핵심 해결책] POM 파일이 없어도 에러를 내지 말고 파일(AAR)을 직접 찾으라고 명령합니다.
                  metadataSources {
                      mavenPom()
                      artifact() 
                  }
                  credentials {
                      username "mvn_read_ws"
                      password "mrk8929"
                  }
              }
          }

          configurations {
              mPaaS_Artifacts {
                  canBeResolved = true
              }
          }

          dependencies {
              // 에러 로그에서 확인되었던 후보 버전들을 전부 등록합니다.
              mPaaS_Artifacts "com.mpaas.android:datacenter:10.2.3-1850000@aar"
              mPaaS_Artifacts "com.mpaas.android:datacenter:10.2.3@aar"
              mPaaS_Artifacts "com.mpaas.android:sqlite:10.2.3-1850000@aar"
              mPaaS_Artifacts "com.mpaas.android:sqlite:10.2.3@aar"
          }

          tasks.register('extractMySDK', Copy) {
              from configurations.mPaaS_Artifacts
              into "extracted_files"
              // 동일한 파일이 있어도 무시하고 진행
              duplicatesStrategy = DuplicatesStrategy.EXCLUDE
          }
          EOF

      - name: Execute Force Download
        run: |
          # 하위 호환성이 가장 좋은 7.6 버전을 사용합니다.
          gradle wrapper --gradle-version 7.6
          # 한 개라도 찾으면 성공하도록 --continue 옵션을 유지합니다.
          ./gradlew extractMySDK --continue || echo "Some targets missing, but checking for files..."

      - name: Verify and Zip
        run: |
          echo "### Final Carving Results ###"
          ls -R extracted_files/ || echo "Still empty..."
          
          if [ "$(ls -A extracted_files/)" ]; then
            zip -r mPaaS_Android_SDK.zip extracted_files/
          else
            echo "Error: Failed to carve any AAR files. Check repository access."
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mPaaS_Final_Android_AARs
          path: mPaaS_Android_SDK.zip
          retention-days: 1
