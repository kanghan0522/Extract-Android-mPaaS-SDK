name: Extract Android mPaaS SDK

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Multi-Target Downloader
        run: |
          cat <<EOF > build.gradle
          apply plugin: 'java'

          repositories {
              google()
              mavenCentral()
              maven {
                  url "https://mvn.cloud.alipay.com/nexus/content/repositories/releases/"
                  credentials {
                      username "mvn_read_ws"
                      password "mrk8929"
                  }
              }
          }

          configurations {
              mPaaS_Artifacts {
                  canBeResolved = true
                  // 하나라도 에러 나면 멈추지 말고 계속 진행하도록 설정
                  ignoreXmlDeclaration = true 
              }
          }

          dependencies {
              // [수사 전략] 가장 가능성 높은 버전 후보군을 전부 그물망에 넣습니다.
              // @aar를 붙여서 지도가 없어도 본체만 보이면 바로 낚아챕니다.
              mPaaS_Artifacts "com.mpaas.android:datacenter:10.2.3@aar"
              mPaaS_Artifacts "com.mpaas.android:datacenter:10.1.68@aar"
              mPaaS_Artifacts "com.mpaas.android:datacenter:10.1.60@aar"
              
              // 보안/암호화 관련 다른 유망한 라이브러리도 추가 (sqlcrypto 타겟)
              mPaaS_Artifacts "com.mpaas.android:sqlite:10.2.3@aar"
              mPaaS_Artifacts "com.mpaas.android:sqlite:10.1.68@aar"
          }

          tasks.register('extractMySDK', Copy) {
              // 찾지 못한 파일이 있어도 무시하고 찾은 것만 복사
              duplicatesStrategy = DuplicatesStrategy.INCLUDE
              from configurations.mPaaS_Artifacts
              into "extracted_files"
              rename { filename ->
                  // 확장자가 없거나 이상하게 복사되는 경우 보정
                  if (!filename.endsWith(".aar")) return filename + ".aar"
                  return filename
              }
          }
          EOF

      - name: Execute Brute-Force Download
        run: |
          gradle wrapper --gradle-version 7.6
          # continue 옵션을 줘서 일부 버전이 없어도 끝까지 실행하게 합니다.
          ./gradlew extractMySDK --continue || echo "Some versions failed, but checking for successes..."

      - name: Verify and Zip
        run: |
          echo "### Contents of extracted_files ###"
          ls -lh extracted_files/ || echo "Folder is empty"
          
          if [ "$(ls -A extracted_files/)" ]; then
            zip -r mPaaS_Android_SDK.zip extracted_files/
          else
            echo "Error: All target versions failed. Checking network/auth..."
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mPaaS_Final_Android_Files
          path: mPaaS_Android_SDK.zip
          retention-days: 1
