name: Extract Android mPaaS SDK (Brute Force)

on: 
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # [추가된 해결책] 파이썬 수사관이 일할 수 있게 도구를 설치합니다.
      - name: Install dependencies
        run: pip install requests

      - name: Targeted Artifact Carving
        shell: python
        run: |
          import os
          import requests
          from requests.auth import HTTPBasicAuth

          auth = HTTPBasicAuth("mvn_read_ws", "mrk8929")
          base_url = "https://mvn.cloud.alipay.com/nexus/content/repositories/releases"
          output_dir = "mPaaS_Artifacts"
          os.makedirs(output_dir, exist_ok=True)

          # mPaaS 내부에서 사용하는 실제 경로 후보군
          targets = [
              "com/mpaas/android/datacenter",
              "com/mpaas/android/sqlite",
              "com/alipay/android/phone/mobilesdk/datacenter-build",
              "com/alipay/android/phone/mobilesdk/sqlite-build"
          ]

          # 유효한 버전 후보군
          versions = ["10.2.3", "10.2.3-1850000", "10.1.68", "10.1.60"]

          print(f"[*] Starting brute-force search on {base_url}...")

          found_any = False
          for target in targets:
              artifact_id = target.split('/')[-1]
              for ver in versions:
                  file_url = f"{base_url}/{target}/{ver}/{artifact_id}-{ver}.aar"
                  print(f"[?] Trying: {file_url}")
                  
                  try:
                      # 타임아웃을 넉넉히 주어 네트워크 지연 대비
                      resp = requests.head(file_url, auth=auth, timeout=15)
                      if resp.status_code == 200:
                          print(f"[!] FOUND! Downloading: {file_url}")
                          file_resp = requests.get(file_url, auth=auth)
                          with open(f"{output_dir}/{artifact_id}-{ver}.aar", "wb") as f:
                              f.write(file_resp.content)
                          found_any = True
                      else:
                          # JAR 확장자 시도
                          jar_url = file_url.replace(".aar", ".jar")
                          resp_jar = requests.head(jar_url, auth=auth, timeout=10)
                          if resp_jar.status_code == 200:
                              print(f"[!] FOUND (JAR)! Downloading: {jar_url}")
                              file_resp = requests.get(jar_url, auth=auth)
                              with open(f"{output_dir}/{artifact_id}-{ver}.jar", "wb") as f:
                                  f.write(file_resp.content)
                              found_any = True
                  except Exception as e:
                      print(f"[E] Error: {e}")

          if not found_any:
              print("[X] Critical Error: No artifacts found. It's a dead end.")
              exit(1)

      - name: Zip and Upload
        run: |
          ls -lh mPaaS_Artifacts/
          zip -r mPaaS_Android_SDK.zip mPaaS_Artifacts/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mPaaS_Android_Carved_Files
          path: mPaaS_Android_SDK.zip
          retention-days: 1
