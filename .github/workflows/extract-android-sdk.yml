name: Extract Android mPaaS SDK

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Direct Download mPaaS Datacenter AAR
        run: |
          mkdir mPaaS_Android_SDK
          cd mPaaS_Android_SDK

          echo "Downloading datacenter component directly from Alipay Nexus..."
          
          # [해결책] Gradle 우회: 알리페이 서버 구조상 가장 보편적인 10.2.3 버전의 datacenter 직접 다운로드
          # 인증 정보(-u)를 포함하여 curl로 AAR 파일을 다이렉트로 당겨옵니다.
          curl -u "mvn_read_ws:mrk8929" -O -L "https://mvn.cloud.alipay.com/nexus/content/repositories/releases/com/mpaas/android/datacenter/10.2.3/datacenter-10.2.3.aar" || echo "Failed to download 10.2.3, trying alternative..."

          # 만약 위 버전이 없다면 빌드 넘버가 포함된 최신 버전으로 재시도
          curl -u "mvn_read_ws:mrk8929" -O -L "https://mvn.cloud.alipay.com/nexus/content/repositories/releases/com/mpaas/android/datacenter/10.2.3-1850000/datacenter-10.2.3-1850000.aar" || echo "Failed fallback download."

          # 다운로드 확인 (용량이 0바이트가 아닌지 체크)
          ls -lh

      - name: Unzip and Extract Native Libraries (.so)
        run: |
          cd mPaaS_Android_SDK
          
          # 다운로드된 AAR 파일 압축 해제
          for f in *.aar; do
            if [ -f "$f" ]; then
              echo "Extracting $f..."
              unzip -q "$f" -d "${f%.aar}_extracted"
            fi
          done

          # 보기 좋게 jni 폴더(.so 파일들)만 루트로 복사
          find . -type d -name "jni" -exec cp -r {} ./native_libs \;

      - name: Zip Artifacts
        run: |
          zip -r mPaaS_Android_SDK.zip mPaaS_Android_SDK/

      - name: Upload Artifact for Download
        uses: actions/upload-artifact@v4
        with:
          name: mPaaS_Official_Android_Artifacts
          path: mPaaS_Android_SDK.zip
          retention-days: 1
